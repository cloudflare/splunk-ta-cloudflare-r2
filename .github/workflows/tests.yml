name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 = the add-on's minimum supported Python (Splunk 9.4). Pinned
          # to ubuntu-22.04: GitHub's ubuntu-latest moved to 26.04, which
          # actions/setup-python cannot install Python 3.9 on (confirmed
          # 2026-11-20 - this is why CI broke on an otherwise untouched repo).
          - python-version: "3.9"
            os: ubuntu-22.04
          # 3.13 = the ceiling declared in python.required (see additional_packaging.py).
          - python-version: "3.13"
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check (package/bin)
        # py_compile only checks syntax - it does not execute module-level
        # imports, so this passes without solnlib/splunklib/import_declare_test
        # installed (those are Splunk-supplied and only exist after ucc-gen
        # build, or in a real Splunk install).
        run: python3 -m py_compile package/bin/*.py

      - name: Run test suite
        # Discovers and runs every tests/test_*.py file automatically, so
        # adding a new test file needs no workflow change here. No network,
        # no credentials, no Splunk/R2 access - tests/_splunk_stubs.py stubs
        # out the UCC/Splunk-supplied imports that cloudflare_r2_helper.py
        # needs just to load (solnlib, splunklib, import_declare_test).
        run: python3 -m unittest discover -s tests -v
